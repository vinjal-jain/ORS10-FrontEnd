<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>
<div class="container-fluid background" style="padding-top:12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="form">

            <!-- TITLE -->
            <h2 *ngIf="!form.data.id" class="text-primary text-center font-weight-bold">
              Add Resource
            </h2>

            <h2 *ngIf="form.data.id" class="text-primary text-center font-weight-bold">
              Update Resource
            </h2>

            <!-- Form error messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- RESOURCE CODE -->
            <div class="form-group pt-2">
              <label><b>Resource Code</b><span class="required-field">*</span></label>
              <input type="text" name="resourceCode" [(ngModel)]="form.data.resourceCode" class="form-control"
                placeholder="Enter Resource Code">

              <span *ngIf="form.inputerror.resourceCode" class="alertRedColor">
                {{ form.inputerror.resourceCode }}
              </span>
            </div>

            <!-- RESOURCE NAME -->
            <div class="form-group pt-2">
              <label><b>Resource Name</b><span class="required-field">*</span></label>
              <input type="text" name="resourceName" [(ngModel)]="form.data.resourceName" class="form-control"
                placeholder="Enter Resource Name">

              <span *ngIf="form.inputerror.resourceName" class="alertRedColor">
                {{ form.inputerror.resourceName }}
              </span>
            </div>

            <!-- RESOURCE TYPE -->
            <div class="form-group pt-2">
              <label><b>Resource Type</b><span class="required-field">*</span></label>
              <select class="form-control" name="resourceType" [(ngModel)]="form.data.resourceType">

                <option [ngValue]="undefined">Select Type</option>
                <option value="HARDWARE">HARDWARE</option>
                <option value="SOFTWARE">SOFTWARE</option>
                <option value="SERVICE">SERVICE</option>
              </select>

              <span *ngIf="form.inputerror.resourceType" class="alertRedColor">
                {{ form.inputerror.resourceType }}
              </span>
            </div>

            <!-- STATUS (BACKEND PRELOAD) -->
            <div class="form-group pt-2">
              <label><b>Status</b><span class="required-field">*</span></label>
              <select class="form-control" name="resourceStatus" [(ngModel)]="form.data.resourceStatus">

                <option [ngValue]="undefined">Select Status</option>

                <option *ngFor="let s of form.preload.statusList | keyvalue" [value]="s.value">
                  {{ s.value }}
                </option>
              </select>

              <span *ngIf="form.inputerror.resourceStatus" class="alertRedColor">
                {{ form.inputerror.resourceStatus }}
              </span>
            </div>

            <!-- BUTTONS -->
            <div class="text-center pt-3">

              <button type="button" *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                Save
              </button>

              <button type="button" *ngIf="form.data.id" (click)="submit()" class="btn btn-success mr-2">
                Update
              </button>

              <a class="btn btn-warning" [routerLink]="['/resourcelist']">
                List
              </a>

            </div>

          </form>

        </div>
      </div>

    </div>

  </div>
</div><app-footer></app-footer>
