<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top:12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">

      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="permissionForm">

            <h2 *ngIf="!form.data.id" class="text-primary text-center font-weight-bold">
              Add Permission
            </h2>

            <h2 *ngIf="form.data.id" class="text-primary text-center font-weight-bold">
              Update Permission
            </h2>

            <!-- Messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>
            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Permission Code -->
            <div class="form-group pt-2">
              <label><b>Permission Code</b><span class="required-field">*</span></label>
              <input type="text" name="permissionCode" [(ngModel)]="form.data.permissionCode" class="form-control"
                placeholder="Enter Permission Code">
              <span *ngIf="form.inputerror.permissionCode" class="alertRedColor">
                {{ form.inputerror.permissionCode }}
              </span>
            </div>

            <!-- Permission Name -->
            <div class="form-group pt-2">
              <label><b>Permission Name</b><span class="required-field">*</span></label>
              <input type="text" name="permissionName" [(ngModel)]="form.data.permissionName" class="form-control"
                placeholder="Enter Permission Name">
              <span *ngIf="form.inputerror.permissionName" class="alertRedColor">
                {{ form.inputerror.permissionName}}
              </span>
            </div>

            <!-- Module Name -->
            <div class="form-group pt-2">
              <label><b>Module Name</b><span class="required-field">*</span></label>
              <input type="text" name="moduleName" [(ngModel)]="form.data.moduleName" class="form-control"
                placeholder="Enter Module Name">

              <span *ngIf="form.inputerror.moduleName" class="alertRedColor">
                {{ form.inputerror.moduleName }}
              </span>
            </div>

            <!-- Access Type (PRELOAD) -->
            <div class="form-group pt-2">
              <label><b>Access Type</b><span class="required-field">*</span></label>
              <select class="form-control" name="accessType" [(ngModel)]="form.data.accessType">
                <option [ngValue]="undefined">Select Access</option>
                <option *ngFor="let a of form.preload?.accessTypeList | keyvalue" [value]="a.value">
                  {{ a.value }}
                </option>
              </select>

              <span *ngIf="form.inputerror.accessType" class="alertRedColor">
                {{ form.inputerror.accessType }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="text-center pt-3">

              <button type="button" *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                Save
              </button>

              <button type="button" *ngIf="form.data.id" (click)="submit()" class="btn btn-success mr-2">
                Update
              </button>

              <a class="btn btn-warning" [routerLink]="['/permissionlist']">
                List
              </a>

            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
