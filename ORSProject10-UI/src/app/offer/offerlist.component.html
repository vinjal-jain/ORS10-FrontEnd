<app-navbar></app-navbar>

<style>
  #nnn {
    background: none;
    border: none;
    cursor: pointer;
  }

  .panel-heading {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .search-inputs {
    margin-top: 20px;
  }

  .search-inputs .form-control,
  .search-inputs .btn {
    margin-bottom: 10px;
  }

  .content-wrapper {
    background: url('assets/files/teahu.png') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: auto;
    height: 105vh;
    padding: 20px;
  }

  .table-responsive {
    margin-top: 20px;
  }

  .search-inputs .col-sm-2,
  .search-inputs .col-sm-1 {
    padding: 0 5px;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="content-wrapper ">
  <div class="container-fluid">
    <div class="panel panel-primary" style="padding-top: 12%;">
      <div class="panel-heading">
        <h1 class="text-primary font-weight-bold">{{ 'Offer List' | translate }}</h1>
      </div>

      <!-- SEARCH BAR -->
      <div class="row search-inputs p-1 justify-content-center g-3">

        <div class="col-sm-2">
          <input type="text"
                 name="offerCode"
                 [(ngModel)]="form.searchParams.offerCode"
                 class="form-control"
                 placeholder="{{ 'Enter Offer Code' | translate }}">
        </div>

        <div class="col-sm-2">
          <input type="date"
                 name="expiryDate"
                 [(ngModel)]="form.searchParams.expiryDate"
                 class="form-control">
        </div>

        <div class="col-sm-2">
          <input type="number"
                 name="discountAmount"
                 [(ngModel)]="form.searchParams.discountAmount"
                 class="form-control"
                 placeholder="{{ 'Enter Discount Amount' | translate }}">
        </div>

        <div class="col-sm-2">
          <select class="form-control"
                  name="offerStatus"
                  [(ngModel)]="form.searchParams.offerStatus">
            <option [ngValue]="undefined">{{ 'Select Status' | translate }}</option>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
            <option value="EXPIRED">EXPIRED</option>
          </select>
        </div>

        <!-- SEARCH -->
        <div class="col-sm-1">
          <button type="button"
                  (click)="search()"
                  class="btn btn-primary w-100">
            {{ 'Search' | translate }}
          </button>
        </div>

        <!-- ADD -->
        <div>
          <button type="button"
                  (click)="forward('/offer')"
                  class="btn btn-success w-100">
            {{ 'Add Offer' | translate }}
          </button>
        </div>

        <!-- DELETE -->
        <div class="col-sm-1">
          <button type="button"
                  (click)="deleteMany()"
                  class="btn btn-danger w-100">
            {{ 'Delete' | translate }}
          </button>
        </div>

      </div>

      <!-- MESSAGE -->
      <div *ngIf="form.error" class="alert alert-danger alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <div *ngIf="!form.error && form.message != null"
           class="alert alert-success alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        {{ form.message }}
      </div>

      <!-- TABLE -->
      <div class="table-responsive">
        <table class="table table-bordered table-hover table-dark">
          <thead class="thead-dark text-uppercase">
            <tr align="center">
              <th>
                <input type="checkbox"
                       [(ngModel)]="isMasterSel"
                       name="list_name"
                       (change)="checkUncheckAll($event)" />
              </th>
              <th>S.No</th>
              <th>Offer Code</th>
              <th>Expiry Date</th>
              <th>Discount Amount</th>
              <th>Status</th>
              <th>Edit</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let m of form.list; let i = index" align="center">
              <td>
                <input type="checkbox"
                       #checkboxes
                       name="list_name"
                       [id]="m.id"
                       (change)="checklistUpdate()" />
              </td>
              <td>{{ (form.pageNo * 5) + i + 1 }}</td>
              <td>{{ m.offerCode }}</td>
              <td>{{ m.expiryDate }}</td>
              <td>{{ m.discountAmount }}</td>
              <td>{{ m.offerStatus }}</td>
              <td>
                <button id="nnn"
                        class="fa fa-edit text-primary"
                        (click)="forward('/offer/' + m.id)">
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- PAGINATION -->
        <div class="d-flex justify-content-between mt-3">
          <button type="button"
                  (click)="previous()"
                  [disabled]="form.pageNo == 0"
                  class="btn btn-info">
            {{ 'Previous' | translate }}
          </button>

          <a class="btn btn-warning mr-1"
             [routerLink]="['/offerlist']"
             (click)="exit()">
            {{ 'Reset' | translate }}
          </a>

          <button type="button"
                  (click)="next()"
                  [disabled]="nextList == 0"
                  class="btn btn-info">
            {{ 'Next' | translate }}
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
