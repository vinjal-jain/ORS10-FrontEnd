<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32,168,168), rgb(219,231,237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }
  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
  }
  .required-field { color: red; }
  .alertRedColor { color: red; }
</style>

<div class="container-fluid background" style="padding-top:12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="inquiryForm">

            <h2 *ngIf="!form.data.id" class="text-primary text-center font-weight-bold">
              Add Inquiry
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary text-center font-weight-bold">
              Update Inquiry
            </h2>

            <!-- Messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Inquirer Name -->
            <div class="form-group pt-2">
              <label><b>Inquirer Name</b><span class="required-field">*</span></label>
              <input type="text" name="inquirerName"
                     [(ngModel)]="form.data.inquirerName"
                     class="form-control"
                     placeholder="Enter Name">
              <span *ngIf="form.inputerror.inquirerName" class="alertRedColor">
                {{ form.inputerror.inquirerName }}
              </span>
            </div>

            <!-- Email -->
            <div class="form-group pt-2">
              <label><b>Email</b><span class="required-field">*</span></label>
              <input type="email" name="email"
                     [(ngModel)]="form.data.email"
                     class="form-control"
                     placeholder="Enter Email">
              <span *ngIf="form.inputerror.email" class="alertRedColor">
                {{ form.inputerror.email }}
              </span>
            </div>

            <!-- Subject -->
            <div class="form-group pt-2">
              <label><b>Inquiry Subject</b><span class="required-field">*</span></label>
              <input type="text" name="inquirySubject"
                     [(ngModel)]="form.data.inquirySubject"
                     class="form-control"
                     placeholder="Enter Subject">
              <span *ngIf="form.inputerror.inquirySubject" class="alertRedColor">
                {{ form.inputerror.inquirySubject }}
              </span>
            </div>

            <!-- Status -->
            <div class="form-group pt-2">
              <label><b>Status</b><span class="required-field">*</span></label>
              <select class="form-control"
                      name="inquiryStatus"
                      [(ngModel)]="form.data.inquiryStatus">
                <option [ngValue]="undefined">Select Status</option>
                <option *ngFor="let s of form.preload.statusList | keyvalue"
                        [value]="s.value">
                  {{ s.value }}
                </option>
              </select>
              <span *ngIf="form.inputerror.inquiryStatus" class="alertRedColor">
                {{ form.inputerror.inquiryStatus }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="row pt-2 pb-3">
              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  Save
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0"
                        (click)="submit()"
                        class="btn btn-success mr-2">
                  Update
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1"
                   [routerLink]="['/inquirylist']"
                   style="color:white;text-decoration:none">
                  List
                </a>
              </div>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
