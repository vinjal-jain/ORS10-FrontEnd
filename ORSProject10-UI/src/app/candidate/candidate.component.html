<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="candidateForm" #f="ngForm">

            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">
              Add Candidate
            </h2>
            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold text-center">
              Update Candidate
            </h2>

            <!-- Messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Candidate Code -->
            <div class="form-group pt-2">
              <label><b>Candidate Code</b><span class="required-field">*</span></label>
              <input type="text" name="candidateCode" [(ngModel)]="form.data.candidateCode" class="form-control"
                required placeholder="Enter Candidate Code">

              <span *ngIf="form.inputerror.candidateCode" class="alertRedColor">
                {{ form.inputerror.candidateCode }}
              </span>
            </div>

            <!-- Candidate Name -->
            <div class="form-group pt-2">
              <label><b>Candidate Name</b><span class="required-field">*</span></label>
              <input type="text" name="candidateName" [(ngModel)]="form.data.candidateName" class="form-control"
                required placeholder="Enter Candidate Name">

              <span *ngIf="form.inputerror.candidateName" class="alertRedColor">
                {{ form.inputerror.candidateName }}
              </span>
            </div>

            <!-- Email -->
            <div class="form-group pt-2">
              <label><b>Email</b><span class="required-field">*</span></label>
              <input type="email" name="email" [(ngModel)]="form.data.email" class="form-control" required
                placeholder="Enter Email">

              <span *ngIf="form.inputerror.email" class="alertRedColor">
                {{ form.inputerror.email }}
              </span>
            </div>

            <!-- Skill Set PRELOAD LIST (IMPORTANT FIX) -->
            <div class="form-group pt-2">
              <label><b>Skill Set</b><span class="required-field">*</span></label>

              <select class="form-control" name="skillSet" [(ngModel)]="form.data.skillSet" required>
                <option [ngValue]="undefined">Select Skill</option>

                <!-- LIST binding (NO keyvalue pipe) -->
                <option *ngFor="let s of form.preload?.skillSetList" [value]="s">
                  {{ s }}
                </option>

              </select>

              <span *ngIf="form.inputerror.skillSet" class="alertRedColor">
                {{ form.inputerror.skillSet }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="row pt-2 pl-2 pb-3">
              <div class="col-md-3"></div>

              <div class="pt-2">
                <button type="button" *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                  Save
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button type="button" *ngIf="form.data.id" (click)="submit()" class="btn btn-success mr-2">
                  Update
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" [routerLink]="['/candidatelist']"
                  style="color:white;text-decoration:none">
                  List
                </a>
              </div>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
